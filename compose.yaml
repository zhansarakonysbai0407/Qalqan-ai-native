services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/qalqan:${IMAGE_TAG:-dev}
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_SERVICE_NAME: qalqan-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qalqan}
      POSTGRES_USER: ${POSTGRES_USER:-qalqan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qalqan} -d ${POSTGRES_DB:-qalqan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: qalqan-otel
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

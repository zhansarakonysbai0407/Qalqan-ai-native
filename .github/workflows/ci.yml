name: CI
on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test API
        run: |
          python -m pip install -r app/requirements-test.txt
          PYTHONPATH=app pytest -q app/test_main.py
      - name: Install and test AI on-call responder
        run: |
          python -m pip install -r oncall/requirements-test.txt
          PYTHONPATH=oncall pytest -q oncall/test_responder.py
      - name: Validate Compose environments
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.hosted.yaml config --quiet
          docker compose -f compose.yaml -f compose.hosted.yaml -f compose.prod.yaml config --quiet
      - name: Build API image
        run: docker build -f app/Dockerfile -t qalqan-api:${{ github.sha }} .
      - name: Build AI on-call image
        run: docker build -f oncall/Dockerfile -t qalqan-oncall:${{ github.sha }} ./oncall
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qalqan:${{ github.sha }}

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qalqan}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-qalqan}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qalqan}
      POSTGRES_USER: ${POSTGRES_USER:-qalqan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - qalqan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qalqan} -d ${POSTGRES_DB:-qalqan}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qalqan_postgres_data:
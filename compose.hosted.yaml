services:
  app:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/qalqan:${IMAGE_TAG:?Set IMAGE_TAG to a tested commit SHA}
    build: null
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?Set environment OTLP endpoint}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
